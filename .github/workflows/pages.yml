# Test, then publish the game on GitHub Pages (Settings > Pages > Source: "GitHub Actions").
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          else
            echo "no tests/ folder: skipping"
          fi
      - name: sw.js precache list is up to date
        run: python3 tools/build_sw.py --check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read          # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the site (game files only)
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R js vendor icons _site/
          python3 tools/build_sw.py _site
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
